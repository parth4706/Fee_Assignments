<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Calculator</h1>
        <output id="display" aria-live="polite">0</output>

        <section aria-label="Calculator buttons">
            <button type="button" data-action="clear">C</button>
            <button type="button" data-action="backspace">Backspace</button>
            <button type="button" data-operation="/">/</button>
            <button type="button" data-operation="*">*</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" data-operation="-">-</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" data-operation="+">+</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" data-action="equals">=</button>

            <button type="button" data-number="0">0</button>
            <button type="button" data-number=".">.</button>
        </section>
    </main>

    <script>
        const display = document.querySelector('#display');
        let currentValue = '0';
        let storedValue = null;
        let pendingOperation = null;
        let waitingForValue = false;

        function updateDisplay() {
            display.value = currentValue;
            display.textContent = currentValue;
        }

        function calculate(firstValue, secondValue, operation) {
            const first = Number(firstValue);
            const second = Number(secondValue);

            if (operation === '+') return first + second;
            if (operation === '-') return first - second;
            if (operation === '*') return first * second;
            if (operation === '/') return second === 0 ? 'Error' : first / second;
            return second;
        }

        function enterNumber(number) {
            if (currentValue === 'Error' || waitingForValue) {
                currentValue = number === '.' ? '0.' : number;
                waitingForValue = false;
            } else if (number === '.' && currentValue.includes('.')) {
                return;
            } else {
                currentValue = currentValue === '0' && number !== '.'
                    ? number
                    : currentValue + number;
            }
            updateDisplay();
        }

        function chooseOperation(operation) {
            if (currentValue === 'Error') return;

            if (pendingOperation && !waitingForValue) {
                const result = calculate(storedValue, currentValue, pendingOperation);
                currentValue = String(result);
                updateDisplay();
            }

            storedValue = currentValue;
            pendingOperation = operation;
            waitingForValue = true;
        }

        function performCalculation() {
            if (!pendingOperation || storedValue === null) return;

            currentValue = String(calculate(storedValue, currentValue, pendingOperation));
            storedValue = null;
            pendingOperation = null;
            waitingForValue = true;
            updateDisplay();
        }

        function clearCalculator() {
            currentValue = '0';
            storedValue = null;
            pendingOperation = null;
            waitingForValue = false;
            updateDisplay();
        }

        function removeLastDigit() {
            if (waitingForValue || currentValue === 'Error') return;
            currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
            updateDisplay();
        }

        document.querySelector('section').addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;

            if (button.dataset.number !== undefined) enterNumber(button.dataset.number);
            if (button.dataset.operation) chooseOperation(button.dataset.operation);
            if (button.dataset.action === 'equals') performCalculation();
            if (button.dataset.action === 'clear') clearCalculator();
            if (button.dataset.action === 'backspace') removeLastDigit();
        });

        document.addEventListener('keydown', (event) => {
            if (/^[0-9.]$/.test(event.key)) enterNumber(event.key);
            if (['+', '-', '*', '/'].includes(event.key)) chooseOperation(event.key);
            if (event.key === 'Enter' || event.key === '=') performCalculation();
            if (event.key === 'Escape') clearCalculator();
            if (event.key === 'Backspace') removeLastDigit();
        });
    </script>
</body>

</html>
